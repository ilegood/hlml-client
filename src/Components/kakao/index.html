<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>카카오맵 연동 페이지</title>

    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="./kakao.css" />
  </head>
  <body>
    <!-- 상단 버튼 UI -->
    <header
      class="header-buttons"
      style="position: absolute; top: 10px; right: 10px; z-index: 10"
    >
      <button id="reserveBtn">예약하기</button>
      <button id="routeBtn">길찾기</button>
    </header>

    <!-- 메인 컨텐츠: 지도 영역 -->
    <main>
      <div
        id="map"
        style="width: 100%; height: 100vh; background-color: #f8f9fa"
      ></div>
    </main>

    <!-- 1. 카카오 API 로드 (https 명시 및 autoload=false 추가) -->
    <script
      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=8705d508e3dd9598b8540f2d9911f54b&autoload=false"
    ></script>

    <!-- 2. 내 로직 파일 로드 -->
    <script src="./kakao.js"></script>
  </body>
</html>
